# Runs as www-data (NOT the apk `nginx` user) so it can read the php-fpm
# unix socket at /run/php-fpm.sock. Using the nginx user gives a silent 403.
user www-data;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 16m;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    server {
        # 8080, not 80, so the container needs no CAP_NET_BIND_SERVICE.
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        error_page 404 /index.php;

        location ~ ^/index\.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
        }

        # Only the front controller may execute PHP.
        location ~ \.php$ { return 404; }
        location ~ /\.(?!well-known).* { deny all; }
    }
}
