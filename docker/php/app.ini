memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 16M
post_max_size = 16M
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps=0 is correct ONLY because the source is baked into the
; image. If you ever bind-mount the source (see docker-compose.override.yml in
; the README), set this to 1 or your edits will appear to do nothing.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
