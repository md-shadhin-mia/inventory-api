[www]
user = www-data
group = www-data

; Unix socket rather than 127.0.0.1:9000 — nginx is in the same container, so
; the socket is faster and unreachable from outside.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; CRITICAL: without this php-fpm scrubs the environment and every variable set
; by docker-compose is invisible to Laravel's env(). This is the single most
; common reason a Dockerised Laravel app "ignores" its compose configuration.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Send worker output to the container log instead of a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
